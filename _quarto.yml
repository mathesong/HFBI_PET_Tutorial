  page-navigation: true
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Overview
      - href: setup.qmd
        text: Before you start
      - section: "Workshop"
        contents:
          - href: 01-ezbids.qmd
            text: "1. BIDS with ezBIDS"
          - href: 02-petprep.qmd
            text: "2. PETPrep"
          - href: 03-bloodstream.qmd
            text: "3. bloodstream"
          - href: 04-petfit.qmd
            text: "4. PETFit"
          - href: 05-petsurfer.qmd
            text: "5. PETSurfer"
          - href: 06-lassen.qmd
            text: "6. Lassen plot"
      - href: troubleshooting.qmd
        text: Troubleshooting

format:
  html:
    theme:
      light: cosmo
